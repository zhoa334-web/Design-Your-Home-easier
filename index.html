<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeDesigner 2D/3D</title>
<!-- Tailwind (CDN) for layout + utility classes -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Three.js (ES modules via import map) -->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  html,body{height:100%;margin:0;background:#0b1220;color:#e2e8f0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .btn{padding:.28rem .6rem;border-radius:.4rem;background:#1e293b;border:1px solid #334155;font-size:12px;cursor:pointer;color:#e2e8f0;white-space:nowrap;line-height:1.3}
  .btn:hover{background:#334155}
  .btn.active{background:#2563eb;border-color:#3b82f6;color:#fff}
  .btn.danger:hover{background:#b91c1c;border-color:#ef4444}
  .tool{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:.5rem;background:rgba(30,41,59,.92);border:1px solid #334155;cursor:pointer;font-size:16px;color:#e2e8f0}
  .tool:hover{background:#334155}.tool.active{background:#2563eb;border-color:#60a5fa}
  .tab{flex:1;padding:.45rem;font-size:12px;text-align:center;cursor:pointer;border-bottom:2px solid transparent;color:#94a3b8}
  .tab.active{color:#fff;border-color:#3b82f6}
  aside{background:#111a2e}
  .scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#334155 transparent}
  .lib-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.45rem .2rem;border-radius:.5rem;background:#1a2540;border:1px solid #26334f;cursor:grab;font-size:11px;text-align:center;color:#cbd5e1}
  .lib-card:hover{background:#243256;border-color:#3b82f6}.lib-card.active{border-color:#3b82f6;background:#1e3a8a}
  .lib-card .ic{font-size:22px;line-height:1.1}.lib-card small{color:#64748b;font-size:9px}
  .sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7b8aa6;margin:.8rem 0 .3rem}
  .field-num,.field-txt,.field-sel{background:#0b1220;border:1px solid #334155;border-radius:.3rem;padding:2px 5px;font-size:12px;color:#e2e8f0;min-width:0}
  .field-num{width:4.8rem}.field-txt,.field-sel{width:100%}
  .insp-row{display:grid;grid-template-columns:5.4rem 4.8rem 1fr;gap:.4rem;align-items:center;margin:.28rem 0;font-size:12px;color:#aab6cc}
  .insp-row2{display:grid;grid-template-columns:5.4rem 1fr;gap:.4rem;align-items:center;margin:.28rem 0;font-size:12px;color:#aab6cc}
  .insp-row label span{color:#64748b}
  input[type=range]{accent-color:#3b82f6;width:100%}
  input[type=color]{width:100%;height:24px;border:1px solid #334155;border-radius:.3rem;background:none;padding:0}
  .style-card{display:block;width:100%;text-align:left;padding:.55rem .6rem;border-radius:.6rem;background:#1a2540;border:2px solid #26334f;cursor:pointer;margin-bottom:.45rem}
  .style-card:hover{border-color:#3b82f6}.style-card.active{border-color:#3b82f6;background:#1e2f5c}
  .sw{display:inline-block;width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.25);margin-right:3px}
  #toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#0f172a;border:1px solid #3b82f6;padding:.5rem .9rem;border-radius:.5rem;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  #toast.show{opacity:1}
  canvas{display:block;touch-action:none}
  .pill{background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:.5rem}
</style>
</head>
<body class="flex flex-col">

<!-- ================= HEADER ================= -->
<header class="h-12 flex items-center gap-2 px-3 bg-slate-900 border-b border-slate-700 text-sm shrink-0">
  <div class="font-semibold mr-2">🏠 HomeDesigner</div>
  <div class="flex gap-1" title="Workspace layout">
    <button class="btn" data-view="2d">2D Plan</button>
    <button class="btn" data-view="split">Split</button>
    <button class="btn" data-view="3d">3D</button>
  </div>
  <div class="flex gap-1 ml-2" title="3D camera mode">
    <button class="btn" id="btnOrbit">🎥 Orbit</button>
    <button class="btn" id="btnWalk">🚶 Walk</button>
  </div>
  <div class="flex-1"></div>
  <button class="btn" id="btnUndo" title="Ctrl+Z">↶ Undo</button>
  <button class="btn" id="btnRedo" title="Ctrl+Y">↷ Redo</button>
  <span class="w-px h-5 bg-slate-700 mx-1"></span>
  <button class="btn" id="btnNew">New</button>
  <button class="btn" id="btnSample">Sample</button>
  <button class="btn" id="btnExport">⬇ Export JSON</button>
  <button class="btn" id="btnImport">⬆ Import JSON</button>
  <input type="file" id="fileImport" accept=".json,application/json" class="hidden">
  <button class="btn" id="btnSnap3d">📷 3D Snapshot</button>
  <button class="btn" id="btnSnap2d">📷 2D Snapshot</button>
</header>

<div class="flex flex-1 min-h-0">
  <!-- ================= LEFT: LIBRARY / STYLES ================= -->
  <aside class="w-72 shrink-0 border-r border-slate-700 flex flex-col min-h-0">
    <div class="flex border-b border-slate-700">
      <div class="tab active" id="tabLib">📦 Library</div>
      <div class="tab" id="tabStyle">🎨 Styles & Light</div>
    </div>

    <div id="panelLib" class="flex-1 min-h-0 flex flex-col">
      <div class="p-2"><input id="libSearch" class="field-txt" placeholder="Search objects…"></div>
      <div id="libList" class="scroll flex-1 px-2 pb-3"></div>
    </div>

    <div id="panelStyle" class="hidden flex-1 min-h-0 scroll px-3 py-2">
      <div class="sec" style="margin-top:.2rem">Style presets</div>
      <div id="styleCards"></div>
      <div class="sec">Smart recommendations</div>
      <div id="recs" class="text-xs text-slate-300"></div>
      <div class="sec">Lighting & scene</div>
      <div class="insp-row2"><label>Warmth <span id="v_rngWarm"></span></label><input type="range" id="rngWarm" min="2000" max="8000" step="100"></div>
      <div class="insp-row2"><label>Sun power <span id="v_rngSun"></span></label><input type="range" id="rngSun" min="0" max="3" step="0.05"></div>
      <div class="insp-row2"><label>Sun azimuth <span id="v_rngAz"></span></label><input type="range" id="rngAz" min="0" max="360" step="1"></div>
      <div class="insp-row2"><label>Sun height <span id="v_rngEl"></span></label><input type="range" id="rngEl" min="5" max="85" step="1"></div>
      <div class="grid grid-cols-2 gap-1 text-xs mt-2">
        <label><input type="checkbox" id="chkInterior"> Interior lamps</label>
        <label><input type="checkbox" id="chkCeiling"> Ceilings</label>
        <label><input type="checkbox" id="chkShadows"> Shadows</label>
        <label><input type="checkbox" id="chkGrid"> 3D grid</label>
        <label><input type="checkbox" id="chkRoof"> Roofs</label>
      </div>
      <div class="sec">New wall defaults</div>
      <div class="insp-row2"><label>Height (m)</label><input type="number" id="defH" class="field-num" step="0.05" min="1" max="6"></div>
      <div class="insp-row2"><label>Thickness (m)</label><input type="number" id="defT" class="field-num" step="0.01" min="0.05" max="0.6"></div>
      <button class="btn mt-1" id="btnApplyH">Apply height to all walls</button>
      <div class="h-6"></div>
    </div>
  </aside>

  <!-- ================= CENTER: WORKSPACE ================= -->
  <main id="workspace" class="flex-1 min-w-0 flex relative">
    <section id="pane2d" class="relative flex-1 min-w-0 border-r border-slate-700">
      <canvas id="plan" class="w-full h-full"></canvas>
      <div class="absolute left-2 top-2 flex flex-col gap-1" id="toolbar">
        <button class="tool" data-tool="select" title="Select / move (V)">🖱️</button>
        <button class="tool" data-tool="wall" title="Wall: click-drag or click-click (W)">▭</button>
        <button class="tool" data-tool="rect" title="Rectangular room (B)">⬜</button>
        <button class="tool" data-tool="room" title="Polygon room (P)">⬡</button>
        <button class="tool" data-tool="door" title="Door (D)">🚪</button>
        <button class="tool" data-tool="window" title="Window (N)">🪟</button>
        <button class="tool" data-tool="pan" title="Pan (H / Space / middle mouse)">✋</button>
      </div>
      <div class="absolute right-2 top-2 flex items-center gap-2 pill px-2 py-1 text-xs">
        Snap
        <select id="snapSel" class="field-sel" style="width:4.2rem">
          <option value="0">Off</option><option value="0.05">5 cm</option><option value="0.1">10 cm</option>
          <option value="0.25" selected>25 cm</option><option value="0.5">50 cm</option><option value="1">1 m</option>
        </select>
        <button class="btn" id="btnFit">Fit</button>
      </div>
      <div id="hint2d" class="absolute left-14 bottom-2 pill px-2 py-1 text-xs text-slate-300"></div>
    </section>

    <section id="pane3d" class="relative flex-1 min-w-0">
      <div id="three" class="absolute inset-0"></div>
      <div class="absolute right-2 top-2 flex gap-1 flex-wrap justify-end" id="camBtns">
        <button class="btn" data-cam="iso">Iso</button>
        <button class="btn" data-cam="top">Top</button>
        <button class="btn" data-cam="front">Front</button>
        <button class="btn" id="btnRoof">🏠 Roof: on</button>
      </div>
      <div id="hint3d" class="absolute left-2 bottom-2 pill px-2 py-1 text-xs text-slate-300"></div>
    </section>
  </main>

  <!-- ================= RIGHT: INSPECTOR ================= -->
  <aside class="w-80 shrink-0 border-l border-slate-700 flex flex-col min-h-0">
    <div class="px-3 py-2 border-b border-slate-700 text-xs font-semibold tracking-wide text-slate-300">PROPERTY INSPECTOR</div>
    <div id="inspector" class="scroll flex-1 px-3 py-2"></div>
    <div id="stats" class="border-t border-slate-700 px-3 py-2 text-xs text-slate-300"></div>
  </aside>
</div>

<footer class="h-7 shrink-0 bg-slate-900 border-t border-slate-700 text-xs px-3 flex items-center justify-between text-slate-400">
  <div id="status">Ready</div>
  <div id="coords">x 0.00 · z 0.00</div>
</footer>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* =====================================================================
   0. COORDINATE CONVENTIONS
   - Units are metres. X = left/right, Y = elevation (up), Z = depth.
   - The 2D plan shows X horizontally and Z vertically (down on screen).
   - Furniture rotation is in degrees, clockwise as seen in the plan view.
   - Furniture "front" faces +Z in local space (down on screen at 0°).
   ===================================================================== */

/* ============================ 1. UTILITIES ========================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const normDeg = a => { a %= 360; return a < 0 ? a + 360 : a; };
const round = (v, n = 3) => Math.round(v * 10 ** n) / 10 ** n;
const el = (tag, cls = '', html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
function rng(seed) { let s = (seed % 2147483646) + 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function rngFor(id) { let s = 7; for (const c of id) s = (s * 31 + c.charCodeAt(0)) >>> 0; return rng(s); }
function shade(hex, amt) { const c = new THREE.Color(hex), h = {}; c.getHSL(h); c.setHSL(h.h, h.s, clamp(h.l + amt, 0, 1)); return '#' + c.getHexString(); }
function kelvinColor(k) { // approximate colour temperature -> RGB
  k /= 100; let r, g, b;
  if (k <= 66) { r = 255; g = 99.4708025861 * Math.log(k) - 161.1195681661; b = k <= 19 ? 0 : 138.5177312231 * Math.log(k - 10) - 305.0447927307; }
  else { r = 329.698727446 * Math.pow(k - 60, -0.1332047592); g = 288.1221695283 * Math.pow(k - 60, -0.0755148492); b = 255; }
  const c = v => clamp(v, 0, 255) / 255;
  return new THREE.Color().setRGB(c(r), c(g), c(b), THREE.SRGBColorSpace);
}
function polyArea(p) { let a = 0; for (let i = 0; i < p.length; i++) { const [x1, z1] = p[i], [x2, z2] = p[(i + 1) % p.length]; a += x1 * z2 - x2 * z1; } return Math.abs(a) / 2; }
function polyCentroid(p) {
  let a = 0, cx = 0, cz = 0;
  for (let i = 0; i < p.length; i++) { const [x1, z1] = p[i], [x2, z2] = p[(i + 1) % p.length], f = x1 * z2 - x2 * z1; a += f; cx += (x1 + x2) * f; cz += (z1 + z2) * f; }
  if (Math.abs(a) < 1e-9) return { x: p.reduce((s, q) => s + q[0], 0) / p.length, z: p.reduce((s, q) => s + q[1], 0) / p.length };
  return { x: cx / (3 * a), z: cz / (3 * a) };
}
function inPoly(x, z, p) { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, zi] = p[i], [xj, zj] = p[j]; if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c; } return c; }
function polyBounds(p) { return { minx: Math.min(...p.map(q => q[0])), maxx: Math.max(...p.map(q => q[0])), minz: Math.min(...p.map(q => q[1])), maxz: Math.max(...p.map(q => q[1])) }; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function download(name, href) { const a = el('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
const stamp = () => new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19);

/* ============================ 2. DATA MODEL ========================= */
const state = {
  walls: [],      // {id,x1,z1,x2,z2,y,thickness,height,color}
  openings: [],   // {id,wallId,kind:'door'|'window',s,w,h,sill,open,flip}
  rooms: [],      // {id,name,pts:[[x,z],...],floor:null|kind}
  furniture: [],  // {id,type,x,y,z,rot,w,h,d,color,auto?}
  style: 'modern',
  settings: { warmth: 4000, sun: 1.1, sunAz: 140, sunEl: 48, interior: true, ceiling: true, shadows: true, grid: true, roof: true, wallHeight: 2.8, wallThickness: 0.15 }
};

const collection = t => ({ wall: state.walls, opening: state.openings, room: state.rooms, furniture: state.furniture }[t]);
const byId = (arr, id) => arr.find(x => x.id === id);
const getSel = () => ui.sel ? byId(collection(ui.sel.type), ui.sel.id) : null;
const wallLen = w => Math.hypot(w.x2 - w.x1, w.z2 - w.z1);

  minimalist:   { label: 'Minimalist',   desc: 'Pure white walls, pale stone tiles and quiet neutral pieces.',            wall: '#f6f6f3', floor: 'tile',     floorTint: '#dcdad4', kelvin: 4500, fabric: '#e4e0d8', wood: '#d9c7a8', white: '#ffffff', metal: '#9b9b9b', accent: '#efece6', roof: '#8d9096', extras: ['plant'] },
  industrial:   { label: 'Industrial',   desc: 'Raw concrete, reclaimed wood, leather brown and black steel.',            wall: '#8e8b86', floor: 'concrete', floorTint: '#8f8f8c', kelvin: 3200, fabric: '#5a4232', wood: '#6f5539', white: '#cfcdc8', metal: '#272727', accent: '#3a3a3a', roof: '#4a4d52', extras: ['bookshelf', 'pendant', 'floorlamp'] },
  scandinavian: { label: 'Scandinavian', desc: 'Bright walls, light oak floor, soft greys and natural textures.',         wall: '#f1f3f4', floor: 'oak',      floorTint: '#d8b98c', kelvin: 3800, fabric: '#c5cbcf', wood: '#d9b98a', white: '#fbfbfb', metal: '#c9c9c9', accent: '#e4cfb4', roof: '#7a4a3e', extras: ['armchair', 'plant', 'floorlamp'] }
};
const FLOOR_TINT = { parquet: '#7b5230', oak: '#d8b98c', walnut: '#6d4630', concrete: '#8f8f8c', tile: '#dcdad4' };
const FLOOR_NAME = { parquet: 'Dark parquet', oak: 'Light oak', walnut: 'Walnut planks', concrete: 'Concrete', tile: 'Stone tile' };
const TEX_SIZE = { parquet: 1.2, oak: 0.9, walnut: 0.9, concrete: 2, tile: 2.4 };

/* ---- Object library ---- */
const CATALOG = [

    addSec(box, 'Dimensions'); addNum(box, 'Length', () => g().L, v => put({ ...g(), L: Math.max(0.1, v) }), { min: 0.1, max: 30, unit: 'm' }); addNum(box, 'Height', () => item.height, v => item.height = Math.max(0.3, v), { min: 0.5, max: 6, unit: 'm' }); addNum(box, 'Thickness', () => item.thickness, v => item.thickness = Math.max(0.03, v), { min: 0.05, max: 0.6, unit: 'm' });
    addSec(box, 'Appearance'); addColor(box, 'Colour', () => item.color, v => item.color = v);
    addButtons(box, [['🗑 Delete', deleteSel, 'danger']]);
  } else if (s.type === 'opening') {
    const w = byId(state.walls, item.wallId), L = w ? wallLen(w) : 5;
    addSelect(box, 'Type', [['door', 'Door'], ['window', 'Window']], () => item.kind, v => { item.kind = v; renderInspector(); });
    addSec(box, 'Position'); addNum(box, 'Along wall', () => item.s, v => item.s = clamp(v, 0.05, L), { min: 0, max: round(L, 2), unit: 'm' }); addNum(box, 'Y (sill)', () => item.sill, v => item.sill = Math.max(0, v), { min: 0, max: 3, unit: 'm' });
    if (w) { const pos = () => { const ux = (w.x2 - w.x1) / L, uz = (w.z2 - w.z1) / L; return [w.x1 + ux * item.s, w.z1 + uz * item.s]; }; addRO(box, 'World X', () => pos()[0].toFixed(3) + ' m'); addRO(box, 'World Z', () => pos()[1].toFixed(3) + ' m'); }
    addSec(box, 'Dimensions'); addNum(box, 'Width', () => item.w, v => item.w = Math.max(0.2, v), { min: 0.3, max: 4, unit: 'm' }); addNum(box, 'Height', () => item.h, v => item.h = Math.max(0.2, v), { min: 0.3, max: 3.5, unit: 'm' });
    if (item.kind === 'door') { addNum(box, 'Open angle', () => item.open, v => item.open = clamp(v, 0, 110), { min: 0, max: 110, step: 1, unit: '°' }); addCheck(box, 'Flip swing', () => item.flip, v => item.flip = v); }
    addButtons(box, [['🗑 Delete', deleteSel, 'danger']]);
  } else if (s.type === 'room') {
    addText(box, 'Name', () => item.name, v => item.name = v);
    addSelect(box, 'Floor', [['', 'Follow style'], ...Object.entries(FLOOR_NAME)], () => item.floor || '', v => item.floor = v || null);
    const c = () => polyCentroid(item.pts), shift = (dx, dz) => item.pts.forEach(p => { p[0] += dx; p[1] += dz; });
    addSec(box, 'Position (centroid)'); addNum(box, 'X', () => c().x, v => shift(v - c().x, 0), { min: -30, max: 30, unit: 'm' }); addNum(box, 'Z', () => c().z, v => shift(0, v - c().z), { min: -30, max: 30, unit: 'm' });
    addSec(box, 'Measurements'); addRO(box, 'Area', () => polyArea(item.pts).toFixed(2) + ' m²'); addRO(box, 'Perimeter', () => item.pts.reduce((s2, p, i) => { const q = item.pts[(i + 1) % item.pts.length]; return s2 + Math.hypot(q[0] - p[0], q[1] - p[1]); }, 0).toFixed(2) + ' m'); addRO(box, 'Corners', () => item.pts.length);
    box.append(el('div', 'text-[11px] text-slate-500 mt-1', 'Areas are measured to wall centre-lines.'));
    addButtons(box, [['🛋 Furnish room', () => { furnishRoom(item); commit(); toast('Room furnished'); }], ['🚶 Walk here', () => setMode3d('walk')], ['🗑 Delete', deleteSel, 'danger']]);
  }
}
function refreshPanels() {
  const wl = state.walls.reduce((s, w) => s + wallLen(w), 0), ar = state.rooms.reduce((s, r) => s + polyArea(r.pts), 0);
  $('#stats').innerHTML = `<div class="flex justify-between"><span>Walls</span><b>${state.walls.length} · ${wl.toFixed(1)} m</b></div><div class="flex justify-between"><span>Rooms</span><b>${state.rooms.length} · ${ar.toFixed(1)} m²</b></div><div class="flex justify-between"><span>Doors / windows</span><b>${state.openings.filter(o => o.kind === 'door').length} / ${state.openings.filter(o => o.kind === 'window').length}</b></div><div class="flex justify-between"><span>Furniture</span><b>${state.furniture.length}</b></div>`;
  $('#btnUndo').style.opacity = histIdx > 0 ? 1 : 0.4; $('#btnRedo').style.opacity = histIdx < hist.length - 1 ? 1 : 0.4; if (!$('#panelStyle').classList.contains('hidden')) renderRecs(); needsDraw = true;
}

/* ============================ 9. PROJECT: IMPORT / EXPORT / SNAPSHOT = */
$('#btnExport').onclick = () => {
  const data = { app: 'HomeDesigner', version: 1, ...JSON.parse(serialize()), camera: { position: camera.position.toArray(), target: orbit.target.toArray() } };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); download(`home-design-${stamp()}.json`, url); setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Design exported');
};
$('#btnImport').onclick = () => $('#fileImport').click();
$('#fileImport').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const obj = JSON.parse(await f.text()); if (!Array.isArray(obj.walls) && !Array.isArray(obj.furniture)) throw new Error('Not a HomeDesigner file'); loadData(obj); commit(); fitView2D(); camPreset('iso'); toast('Design imported'); }
  catch (err) { toast('Import failed: ' + err.message); } e.target.value = '';
};
$('#btnSnap3d').onclick = () => {
  const go = () => { flush(); renderer.render(scene, camera); download(`home-3d-${stamp()}.png`, renderer.domElement.toDataURL('image/png')); toast('3D snapshot saved'); };
  if (ui.view === '2d') { setView('split'); setTimeout(go, 250); } else go();
};
$('#btnSnap2d').onclick = () => { const go = () => { draw2D(); download(`home-plan-${stamp()}.png`, cv.toDataURL('image/png')); toast('2D snapshot saved'); }; if (ui.view === '3d') { setView('split'); setTimeout(go, 250); } else go(); };
$('#btnNew').onclick = () => { if (!confirm('Start a new empty design? (You can still undo.)')) return; loadData({ style: state.style, settings: state.settings }); commit(); fitView2D(); };
$('#btnSample').onclick = () => { loadSample(); fitView2D(); camPreset('iso'); toast('Sample apartment loaded'); };

function loadSample() {
  const th = THEMES[state.style], W = (x1, z1, x2, z2) => ({ id: uid(), x1, z1, x2, z2, y: 0, thickness: 0.15, height: state.settings.wallHeight, color: th.wall });
  const w1 = W(-5, -3.5, 5, -3.5), w2 = W(5, -3.5, 5, 3.5), w3 = W(5, 3.5, -5, 3.5), w4 = W(-5, 3.5, -5, -3.5), p1 = W(1, -3.5, 1, 3.5), p2 = W(1, -0.5, 5, -0.5), p3 = W(1, 1.5, 5, 1.5);
  const O = (wall, key, s, extra = {}) => Object.assign(newOpening(key, wall.id, s), extra);
  const rooms = [['Living Room', [[-5, -3.5], [1, -3.5], [1, 3.5], [-5, 3.5]]], ['Bedroom', [[1, -3.5], [5, -3.5], [5, -0.5], [1, -0.5]]], ['Bathroom', [[1, -0.5], [5, -0.5], [5, 1.5], [1, 1.5]]], ['Kitchen', [[1, 1.5], [5, 1.5], [5, 3.5], [1, 3.5]]]].map(([name, pts]) => ({ id: uid(), name, pts, floor: null }));
  loadData({ walls: [w1, w2, w3, w4, p1, p2, p3], rooms, furniture: [], style: state.style, openings: [
    O(w3, 'door', 9.2), O(w4, 'window2', 3.5), O(w1, 'window', 1.4), O(w1, 'window2', 8), O(w2, 'window', 4, { w: 0.8, h: 0.6, sill: 1.4 }), O(w2, 'window', 6),
    O(p1, 'door', 1.5), O(p1, 'door', 4.0), O(p1, 'door', 6.0, { w: 1.2 })] });
  state.rooms.forEach(furnishRoom);
  const addX = (type, x, z, over = {}) => { const it = Object.assign(newItem(type, x, z), over); state.furniture.push(it); return it; };
  addX('lawn', 0, 0, { w: 22, d: 16 }); addX('tree', -7.6, -5.2); addX('tree', 7.8, 5.0, { w: 1.8, h: 3.8, d: 1.8 }); addX('bush', -3, 4.5); addX('bush', 3, 4.5);
  const rf = addX('roofgable', 0, 0); fitRoof(rf, true); addX('chimney', 3, -1.2, { y: rf.y });
  applyStyle(state.style); commit();
}

/* ============================ 10. KEYBOARD ========================== */
const typing = e => ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox';
addEventListener('keydown', e => {
  if (typing(e)) { if (e.key === 'Escape') e.target.blur(); return; }
  keys[e.code] = true;
  if (ui.mode3d === 'walk' && ui.view !== '2d') { if (e.key === 'Escape') setMode3d('orbit'); return; }
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (e.code === 'Space') { spaceDown = true; e.preventDefault(); return; }
  if (e.key === 'Escape') { cancelTool(); select(null); return; }
  if (e.key === 'Enter' && polyDraw) { finishPoly(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); return; }
  const tk = { v: 'select', w: 'wall', b: 'rect', p: 'room', d: 'door', n: 'window', h: 'pan' }[e.key.toLowerCase()]; if (tk && !ctrl) { if (ui.view === '3d') setView('split'); setTool(tk); return; }
  if (e.key.toLowerCase() === 'r') { if (ui.tool === 'place') { ui.placeRot = (ui.placeRot + (e.shiftKey ? 270 : 90)) % 360; if (ghost) ghost.rot = ui.placeRot; needsDraw = true; } else { const it = getSel(); if (it && ui.sel.type === 'furniture') { it.rot = normDeg(it.rot + (e.shiftKey ? -90 : 90)); moveFurnObj(it); syncInspector(); needsDraw = true; commit(); } } return; }
  if (e.key.startsWith('Arrow')) { const it = getSel(); if (!it) return; e.preventDefault(); const st = ui.snap > 0 ? ui.snap : 0.1, dx = (e.key === 'ArrowRight') - (e.key === 'ArrowLeft'), dz = (e.key === 'ArrowDown') - (e.key === 'ArrowUp');
    if (ui.sel.type === 'furniture') { it.x += dx * st; it.z += dz * st; moveFurnObj(it); } else if (ui.sel.type === 'wall') { it.x1 += dx * st; it.x2 += dx * st; it.z1 += dz * st; it.z2 += dz * st; dirty.arch = true; } else if (ui.sel.type === 'room') { it.pts.forEach(p => { p[0] += dx * st; p[1] += dz * st; }); dirty.arch = true; } else if (ui.sel.type === 'opening') { it.s = Math.max(0.1, it.s + dx * 0.05); dirty.arch = true; }
    syncInspector(); needsDraw = true; commit(); }
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') spaceDown = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; spaceDown = false; });

/* ============================ 11. MAIN LOOP / INIT ================== */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate); const dt = Math.min(clock.getDelta(), 0.1); flush();
  if (ui.view !== '2d') { if (ui.mode3d === 'walk') walkStep(dt); else orbit.update(); renderer.render(scene, camera); }
  if (needsDraw && ui.view !== '3d') { draw2D(); needsDraw = false; }
}
(function init() {
  renderLibrary(); renderStyles(); syncSettingsUI(); bindStart();
  function bindStart() {
    let saved = null; try { saved = localStorage.getItem('homedesigner.v1'); } catch (e) { /* ignore */ }
    if (saved) { try { const o = JSON.parse(saved); if ((o.walls || []).length || (o.furniture || []).length) { loadData(o); commit(); return; } } catch (e) { /* fall through to sample */ } }
    loadSample();
  }
  setView('split'); setTool('select'); $('#btnOrbit').classList.add('active'); updateHints(); renderInspector(); refreshPanels();
  requestAnimationFrame(() => { fitView2D(); camPreset('iso'); }); animate();
})();
</script>
